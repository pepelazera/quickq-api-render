spring.application.name=quickq-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Troque JWT_SECRET nas variaveis de ambiente do Render em producao (este default e so para uso local)
jwt.secret=${JWT_SECRET:quickq-dev-secret-troque-em-producao-0123456789abcdef}
jwt.expiration-ms=86400000