spring.application.name=quickq-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quickq}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Defina JWT_SECRET nas variaveis de ambiente do Render (sem ela, a chave e gerada aleatoriamente
# a cada reinicio, derrubando as sessoes ativas - ver aviso no log de boot).
jwt.expiration-ms=86400000

app.admin.initial-email=${ADMIN_INITIAL_EMAIL:admin@quickq.com}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}